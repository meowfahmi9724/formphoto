<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="light only">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ফর্মফটো – FormPhoto</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light only;--ink:#0f172a;--mut:#64708a;--line:#e6e9f2;--bg:#f3f5fb;--card:#fff;--acc:#3b4ef0;--acc2:#eceffe;--g:linear-gradient(135deg,#3b4ef0,#7c5cff);--ok:#0a8f5b;--bad:#c4321f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
body{margin:0;font-family:'Hind Siliguri',system-ui,sans-serif;background:radial-gradient(900px 420px at 50% -160px,#dde4ff,transparent),var(--bg);color:var(--ink);font-size:15px;line-height:1.5}
button,input{font:inherit;color:inherit}button{cursor:pointer;border:0;background:none}
.top{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;max-width:1100px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:32px;height:32px;border-radius:10px;background:var(--g);position:relative;box-shadow:0 6px 14px -6px rgba(59,78,240,.8)}
.logo:after{content:"";position:absolute;inset:8px 10px;border:2px solid #fff;border-radius:50% 50% 4px 4px/60% 60% 4px 4px}
.brand b{font-size:18px}
#lang{padding:7px 15px;border-radius:99px;background:rgba(255,255,255,.8);border:1px solid var(--line);font-weight:600;font-size:13px;backdrop-filter:blur(8px)}
.wrap{max-width:1100px;margin:0 auto;padding:0 14px 56px}
.hero{position:relative;overflow:hidden;background:linear-gradient(155deg,#0d1646,#2339d6 68%,#5a7bff);color:#fff;border-radius:28px;padding:30px 22px;margin-bottom:16px;box-shadow:0 24px 44px -24px rgba(35,57,214,.8)}
.hero:before,.hero:after{content:"";position:absolute;border-radius:50%;filter:blur(2px)}
.hero:before{width:240px;height:240px;right:-70px;top:-80px;background:radial-gradient(circle,rgba(255,255,255,.28),transparent 70%)}
.hero:after{width:200px;height:200px;left:-60px;bottom:-90px;background:radial-gradient(circle,rgba(124,92,255,.55),transparent 70%)}
.hero>*{position:relative;z-index:1}
.hero h1{margin:0 0 8px;font-size:38px;letter-spacing:-.02em;line-height:1.15}
.lead{margin:0 0 14px;font-size:16.5px;opacity:.94}
.how{margin:0 0 22px;padding-left:22px;display:grid;gap:5px;font-size:15.5px}
.hero .btn{background:#fff;color:var(--acc);box-shadow:0 10px 20px -10px rgba(0,0,0,.5)}
.hero .btn.ghost{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.4);box-shadow:none;backdrop-filter:blur(6px)}
.big .btn{flex:1;min-width:160px;text-align:center;padding:15px 18px;font-size:16px}
.hero.mini{padding:14px 18px}.hero.mini h1{font-size:20px;margin:0 0 10px}
.hero.mini .lead,.hero.mini .how{display:none}
.hero.mini .big .btn{padding:9px 12px;font-size:13.5px}
#work{display:grid;gap:14px}
.stage{position:sticky;top:0;z-index:4;height:38vh;border-radius:24px;background:#12151f;display:flex;align-items:center;justify-content:center;overflow:hidden;box-shadow:0 18px 36px -18px rgba(15,23,42,.7)}
.stage:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 50% 0%,rgba(110,140,255,.25),transparent 62%)}
#c{position:relative;max-width:calc(100% - 28px);max-height:calc(100% - 28px);touch-action:none;border-radius:4px;box-shadow:0 12px 44px rgba(0,0,0,.5);background:repeating-conic-gradient(#ddd 0 25%,#fff 0 50%) 0 0/16px 16px;transform-origin:center}
#c.paint{cursor:none}
.stage.full{position:fixed;inset:0;height:100dvh;border-radius:0;z-index:30;padding-bottom:150px}
.full #c{max-height:calc(100% - 12px)}
.row{display:flex;gap:10px;flex-wrap:wrap}
.btn{padding:12px 18px;border-radius:14px;background:var(--g);color:#fff;font-weight:600;box-shadow:0 10px 18px -10px rgba(59,78,240,.9);transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line);box-shadow:none}
.btn.alt{background:var(--acc2);color:var(--acc);box-shadow:none}
.btn.w{width:100%}.btn.sm{padding:9px 14px;font-size:13.5px;border-radius:11px}
#cmp,#meta,#rz{position:absolute;padding:6px 12px;border-radius:99px;background:rgba(255,255,255,.16);color:#fff;font-size:12px;backdrop-filter:blur(8px)}
#cmp{right:10px;bottom:10px;user-select:none;-webkit-user-select:none;touch-action:none}#meta{left:10px;bottom:10px}
.full #cmp,.full #meta{display:none}
#rz{top:10px;right:10px;z-index:6}
#meta.bad{background:#c4321f}
#busy{position:absolute;inset:0;background:rgba(14,18,30,.86);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;color:#fff;z-index:8;padding:30px;text-align:center}
.bar{width:min(240px,70%);height:6px;border-radius:9px;background:rgba(255,255,255,.18);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:#8aa2ff;transition:width .2s}
#tb{position:absolute;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:6;display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:10px;border-radius:22px;background:rgba(15,20,40,.82);backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.1)}
#tb .seg{background:rgba(255,255,255,.1);flex:1 1 100%}#tb .seg button{color:#cbd5e1}#tb .seg button.on{background:#fff;color:var(--acc)}
.tbs{display:flex;align-items:center;gap:8px;color:#fff;font-size:13px;flex:1;min-width:140px}.tbs input{flex:1}
#tb .ib{padding:9px 14px;border-radius:12px;background:rgba(255,255,255,.14);color:#fff;font-weight:600;font-size:14px}#tb .ib.p{background:#fff;color:var(--acc)}
#br{position:absolute;z-index:7;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1.5px rgba(0,0,0,.6);pointer-events:none;transform:translate(-50%,-50%)}
#br.e{background:rgba(255,70,70,.22)}#br.r{background:rgba(40,200,120,.26)}
.card{background:var(--card);border-radius:24px;padding:20px 18px;display:flex;flex-direction:column;gap:14px;border:1px solid rgba(15,23,42,.05);box-shadow:0 14px 30px -18px rgba(30,41,90,.25)}
.card h3{margin:0;font-size:19px;display:flex;align-items:center;gap:10px}
.ic{width:36px;height:36px;border-radius:12px;background:var(--acc2);display:grid;place-items:center;font-size:18px}
.card .d{margin:-8px 0 0;color:var(--mut);font-size:13.5px}
.opt{background:#f7f8fd;border:1px solid var(--line);border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:10px}
.opt>b{font-size:15px}
.lbl{font-weight:600;font-size:13.5px;color:var(--mut);margin-bottom:7px;display:block}
.seg{display:flex;background:#e9ecf6;border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;padding:9px 4px;border-radius:11px;font-weight:500;font-size:14px;color:var(--mut)}
.seg button.on{background:#fff;color:var(--acc);font-weight:600;box-shadow:0 2px 6px rgba(15,23,42,.14)}
.sw{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sw button,.sw input{width:38px;height:38px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);padding:0}
.sw button.on{box-shadow:0 0 0 3px var(--acc)}
.sw .tr{background:repeating-conic-gradient(#ccc 0 25%,#fff 0 50%) 0 0/10px 10px}
.sl span{display:flex;justify-content:space-between;font-size:13.5px;margin-bottom:2px}
.sl i{font-style:normal;font-weight:500}.sl em{font-style:normal;color:var(--mut)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:9px;background:linear-gradient(90deg,#c9d1ff,#9aa8ff)}
input[type=range]::-moz-range-track{height:6px;border-radius:9px;background:#c9d1ff}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;margin-top:-9px;border-radius:50%;background:#fff;border:2px solid var(--acc);box-shadow:0 3px 8px rgba(59,78,240,.4)}
input[type=range]::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:#fff;border:2px solid var(--acc)}
.f{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f input,.kb{width:100%;padding:13px;border:1.5px solid var(--line);border-radius:14px;background:#f7f8fd;outline:0;font-size:16px}
.f input:focus,.kb:focus{border-color:var(--acc);background:#fff;box-shadow:0 0 0 4px rgba(59,78,240,.12)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips button{padding:7px 13px;border-radius:99px;background:var(--acc2);color:var(--acc);font-size:13px;font-weight:500}
.hint{font-size:12.5px;color:var(--mut);margin:0}
.res{padding:13px 15px;border-radius:15px;background:#e7f7ef;color:var(--ok);display:flex;justify-content:space-between;font-weight:600}
.res.bad{background:#fdeceb;color:var(--bad)}
#toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:14px;font-size:14px;z-index:50;max-width:88vw;text-align:center}
.spin{width:30px;height:30px;border:3px solid rgba(255,255,255,.25);border-top-color:#fff;border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media(prefers-reduced-motion:reduce){.spin{animation:none}}
@media(min-width:900px){#work{grid-template-columns:1fr 450px;align-items:start}.stage:not(.full){top:12px;height:calc(100vh - 24px)}.hero h1{font-size:46px}}
</style>
</head>
<body>
<header class="top"><div class="brand"><i class="logo"></i><b data-i="app"></b></div><button id="lang">EN</button></header>
<main class="wrap">
<section class="hero" id="hero">
 <h1 data-i="app"></h1>
 <p class="lead" data-i="lead"></p>
 <ol class="how"><li data-i="hw1"></li><li data-i="hw2"></li><li data-i="hw3"></li></ol>
 <div class="row big"><button class="btn cam" data-i="cam2"></button><button class="btn ghost pick" data-i="gal2"></button></div>
</section>
<div id="work" hidden>
 <section class="stage" id="stg">
  <canvas id="c" width="300" height="300"></canvas>
  <div id="meta"></div>
  <button id="cmp" data-i="hold"></button>
  <button id="rz" hidden>🔍 1x</button>
  <div id="br" hidden></div>
  <div id="tb" hidden><div class="seg" id="tools"><button data-v="move" data-i="mv"></button><button data-v="erase" class="on" data-i="er"></button><button data-v="restore" data-i="rs"></button></div><label class="tbs"><span data-i="brush"></span><input type="range" id="bs2" min="10" max="100" value="40"></label><button class="ib" id="undo2" data-i="undo"></button><button class="ib p" id="done" data-i="done"></button></div>
  <div id="busy" hidden><div class="spin"></div><div id="bt"></div><div class="bar"><i id="pb"></i></div></div>
 </section>
 <div class="cards">
  <section class="card">
   <h3><span class="ic">✂️</span><span data-i="c1"></span></h3><p class="d" data-i="c1d"></p>
   <div class="opt"><b data-i="qr"></b><p class="hint" data-i="qrh"></p><div id="ts"></div><p class="hint" data-i="tolh"></p><button class="btn w" id="qrb" data-i="qrb"></button></div>
   <div class="opt"><b data-i="aiT"></b><p class="hint" data-i="aih"></p><div class="seg" id="mq"><button data-v="isnet_quint8" data-i="fast"></button><button data-v="isnet_fp16" class="on" data-i="bestq"></button></div><button class="btn w alt" id="ai" data-i="ai"></button></div>
   <div class="opt"><b data-i="hand"></b><p class="hint" data-i="edith"></p><button class="btn w" id="edit" data-i="edit"></button><div id="bs"></div><div class="row"><button class="btn ghost sm" id="undo" data-i="undo"></button><button class="btn ghost sm" id="reset" data-i="reset"></button></div></div>
   <div class="opt"><b data-i="sigT"></b><p class="hint" data-i="sigh"></p><button class="btn ghost w" id="sig" data-i="sig"></button></div>
  </section>
  <section class="card" style="margin-top:14px">
   <h3><span class="ic">🎨</span><span data-i="c2"></span></h3><p class="d" data-i="c2d"></p>
   <div class="sw" id="sw"></div>
  </section>
  <section class="card" style="margin-top:14px">
   <h3><span class="ic">📐</span><span data-i="c3"></span></h3><p class="d" data-i="c3d"></p>
   <div class="f"><label><span class="lbl" data-i="w"></span><input id="W" type="number" inputmode="numeric" min="1" max="4000"></label><label><span class="lbl" data-i="h"></span><input id="H" type="number" inputmode="numeric" min="1" max="4000"></label></div>
   <p class="hint" data-i="sh1"></p>
   <div><span class="lbl" data-i="qk"></span><div class="chips" id="chips"></div></div>
   <div id="zs"></div>
   <div class="row"><button class="btn sm" id="auto" data-i="autof"></button></div>
   <p class="hint" data-i="drag"></p>
  </section>
  <section class="card" style="margin-top:14px">
   <h3><span class="ic">✨</span><span data-i="c4"></span></h3><p class="d" data-i="c4d"></p>
   <div id="sls"></div>
   <div class="row"><button class="btn sm" id="ae" data-i="ae"></button><button class="btn ghost sm" id="er2" data-i="reset"></button></div>
  </section>
  <section class="card" style="margin-top:14px">
   <h3><span class="ic">💾</span><span data-i="c5"></span></h3><p class="d" data-i="c5d"></p>
   <div><span class="lbl" data-i="fmt"></span><div class="seg" id="fmt"><button data-v="jpg" class="on">JPG</button><button data-v="jpeg">JPEG</button><button data-v="png">PNG</button></div></div>
   <div><span class="lbl" data-i="q"></span><div class="seg" id="qs"><button data-v=".8" data-i="good"></button><button data-v=".9" class="on" data-i="better"></button><button data-v=".97" data-i="best"></button></div></div>
   <div><span class="lbl" data-i="kb"></span><input class="kb" id="KB" type="number" inputmode="numeric" min="1" data-p="kbp"></div>
   <div><span class="lbl" data-i="nm"></span><input class="kb" id="NM" maxlength="40" data-p="nmp"></div>
   <div class="res" id="res" hidden></div>
   <p class="hint" id="warn"></p>
   <button class="btn w" id="dl" data-i="dl"></button>
  </section>
 </div>
</div>
</main>
<input type="file" id="f1" accept="image/*" hidden>
<input type="file" id="f2" accept="image/*" capture="user" hidden>
<div id="toast" hidden></div>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];

function dims(){let w=+$('#W').value,h=+$('#H').value;const o=S.orig,ar=o?o.height/o.width:1;
 if(!w&&!h){w=Math.min(o?o.width:600,800);h=Math.round(w*ar)}else if(!h)h=Math.round(w*ar);else if(!w)w=Math.round(h/ar);

function smooth(f){if(!S.sm)return;const w=f.width,h=f.height,s=mk(w>>1,h>>1);s.getContext('2d').drawImage(f,0,0,s.width,s.height);const x=f.getContext('2d');x.globalAlpha=S.sm/100*.8;x.drawImage(s,0,0,w,h);x.globalAlpha=1}
function adjust(c){if(S.br==100&&S.ct==100&&S.sa==100&&!S.sh)return;const x=c.getContext('2d'),w=c.width,h=c.height,id=x.getImageData(0,0,w,h),d=id.data,b=S.br/100,k=S.ct/100,s=S.sa/100;
 if(b!=1||k!=1||s!=1)for(let i=0;i<d.length;i+=4){if(!d[i+3])continue;const l=.299*d[i]+.587*d[i+1]+.114*d[i+2];for(let j=0;j<3;j++){let v=l+(d[i+j]-l)*s;d[i+j]=(v*b-128)*k+128}}
 if(S.sh){const a=S.sh/100*1.2,o=new Uint8ClampedArray(d),r=w*4;for(let y=1;y<h-1;y++)for(let X=1;X<w-1;X++){const i=y*r+X*4;if(!o[i+3])continue;for(let j=0;j<3;j++){const v=o[i+j];d[i+j]=v+a*(4*v-o[i+j-4]-o[i+j+4]-o[i+j-r]-o[i+j+r])}}}

const ptr=new Map();let pinch=null,tm=0,st=false;
function pst(){const[a,b]=[...ptr.values()],r=cv.getBoundingClientRect(),cx=(a.x+b.x)/2,cy=(a.y+b.y)/2,Cx=r.left+r.width/2-S.vx,Cy=r.top+r.height/2-S.vy;return{d:Math.hypot(a.x-b.x,a.y-b.y)||1,vz:S.vz,Cx,Cy,qx:(cx-Cx-S.vx)/S.vz,qy:(cy-Cy-S.vy)/S.vz}}
function doPinch(){const[a,b]=[...ptr.values()],cx=(a.x+b.x)/2,cy=(a.y+b.y)/2,z=Math.max(1,Math.min(8,pinch.vz*Math.hypot(a.x-b.x,a.y-b.y)/pinch.d));S.vz=z;S.vx=z==1?0:cx-pinch.Cx-z*pinch.qx;S.vy=z==1?0:cy-pinch.Cy-z*pinch.qy;view()}
cv.onpointerdown=e=>{if(!S.fg)return;cv.setPointerCapture(e.pointerId);ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(ptr.size==2){clearTimeout(tm);pinch=pst();pd=null;last=null;ring(false);return}
 if(ptr.size==1){pd={x:e.clientX,y:e.clientY};last=null;st=false;if(S.tool!='move'){ring(e);clearTimeout(tm);tm=setTimeout(()=>begin(e),70)}}};
function begin(e){if(ptr.size==1&&pd&&!st){st=true;push();paint(e)}}
cv.onpointermove=e=>{const p=ptr.get(e.pointerId);if(!p){if(e.pointerType=='mouse')ring(e);return}
 p.x=e.clientX;p.y=e.clientY;if(ptr.size>=2&&pinch){doPinch();return}
 if(!pd||ptr.size>1)return;
 if(S.tool=='move'){const r=cv.getBoundingClientRect();S.ox+=(e.clientX-pd.x)/r.width;S.oy+=(e.clientY-pd.y)/r.height;pd={x:e.clientX,y:e.clientY};draw()}else{clearTimeout(tm);begin(e);paint(e);ring(e)}};
cv.onpointerup=cv.onpointercancel=e=>{ptr.delete(e.pointerId);if(ptr.size<2)pinch=null;if(!ptr.size){if(pd)info();pd=null;last=null;ring(false)}};
cv.onpointerleave=()=>{if(!pd)ring(false)};
cv.addEventListener('wheel',e=>{if(!S.fg)return;e.preventDefault();S.vz=Math.max(1,Math.min(8,S.vz*(e.deltaY<0?1.12:.89)));if(S.vz==1)S.vx=S.vy=0;view()},{passive:false});
$('#rz').onclick=resetView;$('#edit').onclick=()=>{if(!S.fg)return toast(t('first'));setTool('erase')};$('#done').onclick=closeFull;$('#undo2').onclick=()=>$('#undo').click();$('#bs2').oninput=e=>setSl('brush',+e.target.value);
$('#undo').onclick=()=>{if(S.undo.length){S.fg=S.undo.pop();draw();info()}};

/* auto frame */
function frame(sig){const f=S.fg;if(!f)return;const w=f.width,h=f.height,q=4,s=mk(Math.ceil(w/q),Math.ceil(h/q));s.getContext('2d').drawImage(f,0,0,s.width,s.height);
 const d=s.getContext('2d').getImageData(0,0,s.width,s.height).data;let x0=1e9,y0=1e9,x1=-1,y1=-1;
 for(let y=0;y<s.height;y++)for(let x=0;x<s.width;x++)if(d[(y*s.width+x)*4+3]>40){if(x<x0)x0=x;if(x>x1)x1=x;if(y<y0)y0=y;if(y>y1)y1=y}
 if(x1<0)return;const bx=x0*q,by=y0*q,bw=(x1-x0+1)*q,bh=(y1-y0+1)*q,[W,H]=dims(),b=Math.max(W/w,H/h);
 let sc=sig?Math.min(.94*W/bw,.84*H/bh):Math.min(.98*W/bw,.92*H/bh);setSl('zoom',Math.max(20,Math.min(400,sc/b*100)));sc=b*S.zoom/100;
 S.ox=(W/2-(bx+bw/2)*sc-(W-w*sc)/2)/W;const ty=sig?(H-bh*sc)/2:.04*H;S.oy=(ty-by*sc-(H-h*sc)/2)/H}
$('#auto').onclick=()=>{if(!S.fg)return toast(t('first'));frame(dims()[1]<120);draw();info()};

/* AI background removal */
$('#ai').onclick=async()=>{if(!S.orig)return toast(t('first'));busy(true,t('load'));
 try{if(!window.rb){try{window.rb=await import('https://esm.sh/@imgly/background-removal@1.5.5')}catch(e){window.rb=await import('https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.5.5/+esm')}}
  const k=Math.min(1,1024/Math.max(S.orig.width,S.orig.height)),sm=mk(Math.round(S.orig.width*k),Math.round(S.orig.height*k));sm.getContext('2d').drawImage(S.orig,0,0,sm.width,sm.height);
  const blob=await new Promise(r=>sm.toBlob(r,'image/png'));
  const out=await window.rb.removeBackground(blob,{model:S.model,output:{format:'image/png'},progress:(k,c,n)=>{$('#bt').textContent=String(k).startsWith('fetch')?t('load'):t('proc');if(n)$('#pb').style.width=Math.round(c/n*100)+'%'}});
  const bm=await createImageBitmap(out),m=mk(S.orig.width,S.orig.height),mx=m.getContext('2d');mx.drawImage(bm,0,0,m.width,m.height);
  const md=mx.getImageData(0,0,m.width,m.height).data,n=cl(S.orig),nx=n.getContext('2d'),nd=nx.getImageData(0,0,n.width,n.height),dd=nd.data;
  for(let i=3;i<dd.length;i+=4)dd[i]=md[i];nx.putImageData(nd,0,0);push();S.fg=n;frame(false);draw();info()
 }catch(e){console.error(e);toast(t('aierr'))}busy(false)};
seg('#mq',v=>S.model=v);
function quick(redo){if(!S.orig)return toast(t('first'));if(!redo)push();const o=S.orig,w=o.width,h=o.height,src=o.getContext('2d').getImageData(0,0,w,h),d=src.data,N=w*h,tol=S.tol;
 let r=0,g=0,b=0,n=0;const bw=Math.max(2,Math.round(Math.min(w,h)*.02)),add=(X,Y)=>{const i=(Y*w+X)*4;r+=d[i];g+=d[i+1];b+=d[i+2];n++};
 for(let y=0;y<bw;y++)for(let X=0;X<w;X+=2)add(X,y);
 for(let y=0;y<h*.6;y+=2)for(let X=0;X<bw;X++){add(X,y);add(w-1-X,y)}
 r/=n;g/=n;b/=n;const bg=new Uint8Array(N),q=new Int32Array(N);let qs=0,qe=0;
 const tp=p=>{if(!bg[p]){const i=p*4;if(Math.hypot(d[i]-r,d[i+1]-g,d[i+2]-b)<tol){bg[p]=1;q[qe++]=p}}};
 for(let X=0;X<w;X++){tp(X);tp((h-1)*w+X)}for(let y=0;y<h;y++){tp(y*w);tp(y*w+w-1)}
 while(qs<qe){const p=q[qs++],X=p%w;if(X>0)tp(p-1);if(X<w-1)tp(p+1);if(p>=w)tp(p-w);if(p<N-w)tp(p+w)}
 const a=new Uint8Array(N);for(let p=0;p<N;p++){const X=p%w;a[p]=(bg[p]||(X>0&&bg[p-1])||(X<w-1&&bg[p+1])||(p>=w&&bg[p-w])||(p<N-w&&bg[p+w]))?0:255}
 for(let p=0;p<N;p++){const X=p%w;let s=a[p],c=1;if(X>0){s+=a[p-1];c++}if(X<w-1){s+=a[p+1];c++}if(p>=w){s+=a[p-w];c++}if(p<N-w){s+=a[p+w];c++}d[p*4+3]=s/c}
 const f=mk(w,h);f.getContext('2d').putImageData(src,0,0);S.fg=f;S.quick=true;frame(false);draw();info()}
$('#qrb').onclick=()=>quick(false);
document.addEventListener('change',e=>{if(e.target.id=='s_tol'&&S.quick)quick(true)});

/* signature clean */
$('#sig').onclick=()=>{if(!S.orig)return toast(t('first'));push();const f=cl(S.orig),x=f.getContext('2d'),id=x.getImageData(0,0,f.width,f.height),d=id.data;
 for(let i=0;i<d.length;i+=4){const l=.299*d[i]+.587*d[i+1]+.114*d[i+2];d[i+3]=Math.max(0,Math.min(255,(190-l)*2.8));d[i]*=.6;d[i+1]*=.6;d[i+2]*=.6}
 x.putImageData(id,0,0);S.fg=f;setBg('#ffffff');frame(true);draw();info()};

/* export */
async function build(){const c=mk(1,1);render(c,1,true);const png=S.fmt=='png',mime=png?'image/png':'image/jpeg',tb=q=>new Promise(r=>c.toBlob(r,mime,q)),T=(+$('#KB').value||0)*1024;
 if(png)return{blob:await tb(),png:true,T};
 let b=await tb(S.q),miss=false;
 if(T&&b.size>T){let lo=.02,hi=S.q,best=null;for(let i=0;i<9;i++){const m=(lo+hi)/2,x=await tb(m);if(x.size<=T){best=x;lo=m}else hi=m}
  if(best)b=best;else{b=await tb(.02);miss=b.size>T}}
 return{blob:b,miss,T}}
var it;function info(){clearTimeout(it);it=setTimeout(async()=>{if(!S.fg)return;const[W,H]=dims(),r=await build(),kb=r.blob.size/1024,bad=r.T&&kb>r.T/1024;
 const txt=`${kb.toFixed(1)} KB · ${W}×${H}px`;$('#meta').textContent=txt;$('#meta').classList.toggle('bad',!!bad);
 $('#res').hidden=false;$('#res').className='res'+(bad?' bad':'');$('#res').innerHTML=`<span>${kb.toFixed(1)} KB</span><span>${W}×${H}px</span>`;
 $('#warn').textContent=bad?t('miss'):(r.png&&r.T?t('pngw'):'')},350)}
